project_id = "GPXSuite"

[auth]
enabled = true
site_url = "https://onescore98.github.io/GpxSuite/"
additional_redirect_urls = [
  "https://onescore98.github.io/GpxSuite/",
  "http://localhost:8080/"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600
